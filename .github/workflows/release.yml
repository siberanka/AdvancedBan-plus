name: Release Verification

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify legacy and current API profiles
        run: |
          mvn -B -ntp clean verify
          mvn -B -ntp -Ppaper-26 clean verify

      - name: Upload verified Bundle JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedBan-Release-Bundle
          path: bundle/target/AdvancedBan-Bundle-*-RELEASE.jar
          if-no-files-found: error
          retention-days: 30
