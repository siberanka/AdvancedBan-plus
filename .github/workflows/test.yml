name: Compatibility Tests

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MC 1.16.x / Java 11
            java: '11'
            command: mvn -B -ntp -pl core,bukkit,bungee,folia -am clean verify
          - name: MC 1.21.11 / Java 21
            java: '21'
            command: mvn -B -ntp -Ppaper-1.21 clean verify
          - name: MC 26.x / Java 25
            java: '25'
            command: mvn -B -ntp -Ppaper-26 clean verify

    steps:
      - uses: actions/checkout@v6

      - name: Set up Temurin ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        run: ${{ matrix.command }}
