name: Build

on:
  push:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find bundle/target -maxdepth 1 -name 'AdvancedBan-Bundle-*-RELEASE.jar' -print -quit)"
          test -n "$bundle"
          jar tf "$bundle" | grep -qx 'plugin.yml'
          jar tf "$bundle" | grep -qx 'bungee.yml'
          jar tf "$bundle" | grep -qx 'velocity-plugin.json'
          if javap -classpath "$bundle" -p me.leoko.advancedban.velocity.VelocityMain \
            | grep -q 'shaded.org.slf4j.Logger,'; then
            echo 'Velocity constructor contains a relocated injectable logger type.'
            exit 1
          fi

      - name: Upload Bundle JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedBan-Bundle
          path: bundle/target/AdvancedBan-Bundle-*-RELEASE.jar
          if-no-files-found: error
          retention-days: 14
